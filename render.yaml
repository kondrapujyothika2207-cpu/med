services:
  - type: web
    name: medicine-rfid-system
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: SEED_DEMO_USERS
        value: "false"
